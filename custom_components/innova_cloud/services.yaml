set_manual_mode:
  target:
    entity:
      integration: innova_cloud
      domain: climate
  fields:
    enabled:
      required: true
      example: true
      selector:
        boolean:
    hours:
      required: false
      example: 2
      selector:
        number:
          min: 0.25
          max: 168
          step: 0.25
          unit_of_measurement: h
